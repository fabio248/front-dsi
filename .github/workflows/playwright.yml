name: Playwright E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build app
        run: npm run build

      - name: Start app
        run: npm run start -- --port 3000 &
        env:
          CI: true
          VITE_BASE_API: https://dsi-nest-backend-development.up.railway.app/api/v1
          VITE_BASE_PATH: https://dsi-nest-backend-development.up.railway.app/
          VITE_BASE_SUPABASE: https://vet-mitsun-development.vercel.app/login
          VITE_MEDICALHISTORIES: medical-histories
          VITE_BILLS: bills
          VITE_PRODUCTS: products
          VITE_LOGIN: auth/login
          VITE_GOOGLEAUTH: auth/login-google
          VITE_FORGOTPASSWORD: auth/change-password
          VITE_USERS: users
          VITE_REFRESH_ACCESS_TOKEN: auth/refresh-token
          VITE_PETS: pets
          VITE_SPECIES: species
          VITE_APPOINTMENTS: appointments
          VITE_FILE: files
          VITE_ACCESS: access
          VITE_REFRESH: refresh
          VITE_PROVIDERTOKEN: providerToken

      - name: Wait for Localhost
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true
          URL: http://localhost:3000
          ADMIN_EMAIL: fabioflores021@gmail.com
          ADMIN_PASSWORD: VRE_fdu8jyu1quz*kjm

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
