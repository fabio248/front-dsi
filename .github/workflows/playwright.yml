name: Playwright E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      CI: true
      VITE_BASE_API: ${{ secrets.VITE_BASE_API }}
      VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH }}
      VITE_BASE_SUPABASE: ${{ secrets.VITE_BASE_SUPABASE }}
      VITE_MEDICALHISTORIES: medical-histories
      VITE_BILLS: bills
      VITE_PRODUCTS: products
      VITE_LOGIN: auth/login
      VITE_GOOGLEAUTH: auth/login-google
      VITE_FORGOTPASSWORD: auth/change-password
      VITE_USERS: users
      VITE_REFRESH_ACCESS_TOKEN: auth/refresh-token
      VITE_PETS: pets
      VITE_SPECIES: species
      VITE_APPOINTMENTS: appointments
      VITE_FILE: files
      VITE_ACCESS: access
      VITE_REFRESH: refresh
      VITE_PROVIDERTOKEN: providerToken
      URL: http://127.0.0.1:5173
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
      CLIENT_PASSWORD: ${{ secrets.CLIENT_PASSWORD }}
      VITE_SUPABASEURL: ${{ secrets.VITE_SUPABASEURL }}
      VITE_SUPABASEKEY: ${{ secrets.VITE_SUPABASEKEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          if-no-files-found: warn
